name: acorn

services:
  postgres:
    image: postgres:16-alpine
    container_name: acorn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acorn}
      POSTGRES_USER: ${POSTGRES_USER:-acorn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acorn_dev_only}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - acorn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acorn} -d ${POSTGRES_DB:-acorn}"]
      interval: 3s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: acorn-seaweedfs
    command: "server -s3 -filer -dir=/data -s3.port=8333 -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - acorn_seaweedfs_data:/data
      - ./infrastructure/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9333/cluster/status > /dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  acorn_postgres_data:
  acorn_seaweedfs_data:
